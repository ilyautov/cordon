name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Only the library half. The committed bundle must NOT be regenerated
      # before the tests: one of them checks that the bundle in the repository
      # still matches the sources, and a rebuild would make that check pass by
      # construction. Building dist/ here also keeps two parallel test workers
      # from each starting a build of their own.
      - run: npm run build:lib
      # Bounded, and the verdict comes from the report rather than from the
      # exit. vitest 4's forks pool has been seen to finish a wholly
      # successful run and then never end, so "the process stopped" is not
      # evidence of anything. "The report says 860 tests passed" is.
      - name: test
        timeout-minutes: 6
        run: |
          timeout --preserve-status 300 npx vitest run \
            --reporter=default --reporter=json --outputFile=vitest-report.json || true
      - name: the run passed, and the numbers in the READMEs are the real ones
        run: node scripts/check-claims.mjs vitest-report.json
      - run: npm run typecheck
      - run: npm run build
      - name: no-invisible
        run: node scripts/no-invisible.mjs

      - name: self-scan
        run: |
          # Cordon must pass its own documentation cleanly: a finding there
          # means either an invisible character that crept into the text, or
          # the tool mangling its own docs. Files are iterated one by one:
          # scan reads a single file per run and refuses extra ones.
          #
          # docs/scenarios.md is deliberately excluded. It describes attacks,
          # which means it contains them, and will always produce findings.
          # Gating on it means either a permanently red build or weakening the
          # condition until it means nothing. QUICKSTART.md is excluded for the
          # same reason: it opens by showing the reader a real hidden block.
          # The pull-request template is excluded because HTML comments are
          # what a template is made of.
          for f in README.md README.ru.md docs/install.md docs/install-gemini.md SECURITY.md CONTRIBUTING.md PRIVACY_POLICY.md SUPPORT.md CODE_OF_CONDUCT.md AGENTS.md assets/README.md; do
            node dist/cli.js scan "$f" --json > /tmp/self-scan.json
            node -e "
              const r = require('/tmp/self-scan.json')
              const bad = r.findings.filter(x => ['invisible','hidden-html','mixed-script'].includes(x.kind))
              if (bad.length) { console.error('self-scan failed on $f:', JSON.stringify(bad, null, 2)); process.exit(1) }
              console.log('self-scan ok: $f')
            "
          done
