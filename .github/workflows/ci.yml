name: ci

on:
  push:
  pull_request:

jobs:
  # The hooks run on the developer's machine, so the suite runs where they do:
  # both supported Node lines on Linux, and macOS, where /tmp is a symbolic
  # link and path canonicalization has already bitten once.
  portability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run build:lib
      - name: test
        timeout-minutes: 8
        run: npx vitest run

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm ci
      # Only the library half. The committed bundle must NOT be regenerated
      # before the tests: one of them checks that the bundle in the repository
      # still matches the sources, and a rebuild would make that check pass by
      # construction. Building dist/ here also keeps two parallel test workers
      # from each starting a build of their own.
      - run: npm run build:lib
      # Bounded, because a suite that stops finishing must fail rather than
      # burn the job's whole allowance. The verdict is read from the report
      # instead of the exit code: a run killed at the limit exits non-zero
      # with nothing to say, while the report names how many tests ran and
      # whether they passed, and the READMEs are checked against that number
      # in the same step.
      - name: test
        timeout-minutes: 5
        run: |
          # vitest is started directly rather than through npm, so that the
          # kill reaches it: `timeout` signals its own child, and through a
          # package script that child is a wrapper.
          timeout --signal=KILL 240 \
            node node_modules/vitest/vitest.mjs run \
            --reporter=default --reporter=json --outputFile=vitest-report.json
      - name: the numbers on the pages are the real ones
        run: node scripts/check-claims.mjs vitest-report.json
      - run: npm run typecheck
      - run: npm run build
      - name: no-invisible
        run: node scripts/no-invisible.mjs

      - name: self-audit
        # The repository passes its own audit: no invisible characters in
        # AGENTS.md or anything else an agent working here would load. HOME
        # is emptied so the runner's own configuration is not what is judged.
        run: HOME="$(mktemp -d)" node dist/cli.js audit . --fail-on medium

      - name: self-scan
        run: |
          # Cordon must pass its own documentation cleanly: a finding there
          # means either an invisible character that crept into the text, or
          # the tool mangling its own docs. Files are iterated one by one:
          # scan reads a single file per run and refuses extra ones.
          #
          # docs/scenarios.md is deliberately excluded. It describes attacks,
          # which means it contains them, and will always produce findings.
          # Gating on it means either a permanently red build or weakening the
          # condition until it means nothing. QUICKSTART.md is excluded for the
          # same reason: it opens by showing the reader a real hidden block.
          # The pull-request template is excluded because HTML comments are
          # what a template is made of.
          for f in README.md README.ru.md docs/audit.md docs/comparison.md docs/enterprise.md docs/install.md docs/install-gemini.md docs/live-run.md SECURITY.md CONTRIBUTING.md PRIVACY_POLICY.md SUPPORT.md CODE_OF_CONDUCT.md AGENTS.md assets/README.md; do
            node dist/cli.js scan "$f" --json > /tmp/self-scan.json
            node -e "
              const r = require('/tmp/self-scan.json')
              const bad = r.findings.filter(x => ['invisible','hidden-html','mixed-script'].includes(x.kind))
              if (bad.length) { console.error('self-scan failed on $f:', JSON.stringify(bad, null, 2)); process.exit(1) }
              console.log('self-scan ok: $f')
            "
          done
