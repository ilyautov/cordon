# Конфигурация сканера HOL Guard.
#
# Единственное исключение, и вот почему оно нужно. Файл
# tests/sanitize/encoded.test.ts содержит корпус BENIGN: строки, на которые
# Cordon ОБЯЗАН молчать. Там намеренно лежат вещи, похожие на секреты, но
# секретами не являющиеся: публичный PEM-ключ, подпись транзакции, вложение
# письма и AKIAIOSFODNN7EXAMPLE, опубликованный AWS как пример-заглушка в
# собственной документации. Это отрицательные контроли детектора, без них
# тесты не проверяют главное: что инструмент не поднимает тревогу на обычном
# тексте. Сканер справедливо видит там форму секрета и не может знать, что
# это витрина. Исключение узкое, на один файл, а не на весь tests/.
[scanner]
ignore_paths = ["tests/sanitize/encoded.test.ts"]
