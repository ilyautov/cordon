# Конфигурация сканера HOL Guard.
#
# Одно исключение, и вот почему. В tests/adversarial/battery.ts лежит
# фиктивный токен: батарея разыгрывает сценарий, где агент прочитал ключ из
# конфига, а вредоносная страница пытается этот ключ увести. Без токена в
# исходнике сценарий нечем проверять. Сканер честно видит форму секрета и не
# может знать, что это декорация теста, поэтому исключение узкое, на один
# файл, а не на каталог tests целиком.
#
# Строку самого токена этот комментарий намеренно не повторяет: правило ловит
# её в любом файле, включая конфиг.
[scanner]
ignore_paths = ["tests/adversarial/battery.ts"]
