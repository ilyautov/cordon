name: PR quality gate
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Existing lab PR number
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
  statuses: write
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Pin selected PR head
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_PR: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          pr_number=$(jq -r '.pull_request.number // empty' "$GITHUB_EVENT_PATH")
          if [[ -z "$pr_number" ]]; then pr_number="$DISPATCH_PR"; fi
          if [[ ! "$pr_number" =~ ^[1-9][0-9]*$ ]]; then exit 1; fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number" > "$RUNNER_TEMP/pr.json"
          head_sha=$(jq -r '.head.sha' "$RUNNER_TEMP/pr.json")
          base_sha=$(jq -r '.base.sha' "$RUNNER_TEMP/pr.json")
          policy_sha=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)
          event_sha=$(jq -r '.pull_request.head.sha // empty' "$GITHUB_EVENT_PATH")
          if [[ ! "$head_sha" =~ ^[a-f0-9]{40}$ ]]; then exit 1; fi
          if [[ ! "$base_sha" =~ ^[a-f0-9]{40}$ ]]; then exit 1; fi
          if [[ ! "$policy_sha" =~ ^[a-f0-9]{40}$ ]]; then exit 1; fi
          if [[ -n "$event_sha" && "$event_sha" != "$head_sha" ]]; then exit 1; fi
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "policy_sha=$policy_sha" >> "$GITHUB_OUTPUT"
      - name: Check out trusted base policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.pin.outputs.policy_sha }}
          path: policy
          persist-credentials: false
      - name: Check out exact candidate head as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.pin.outputs.head_sha }}
          path: candidate
          persist-credentials: false
          fetch-depth: 0
      - name: Check candidate and publish SHA-bound status
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pin.outputs.pr_number }}
          PR_EXPECTED_SHA: ${{ steps.pin.outputs.head_sha }}
          PR_BASE_SHA: ${{ steps.pin.outputs.base_sha }}
          PR_CANDIDATE_DIR: ${{ github.workspace }}/candidate
        run: |
          set -euo pipefail
          current_before=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)
          if PR_CURRENT_SHA="$current_before" node policy/.github/scripts/quality-check.mjs; then
            verdict=success
          else
            verdict=failure
          fi
          current_after=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)
          if [[ "$current_after" != "$PR_EXPECTED_SHA" ]]; then verdict=failure; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$PR_EXPECTED_SHA" -X POST \
            -f state="$verdict" -f context='cordon-lab/quality' \
            -f description="Lab markup check at exact PR head: $verdict" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
          if [[ "$verdict" != success ]]; then exit 1; fi
